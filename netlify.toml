[build]
  command = "npm run build"
  publish = "."

# Production backend adresi repository içinde sabitlenmez.
# Netlify Production ortamında PERSONA_CARD_BACKEND_URL açıkça tanımlanmalıdır.
# Böylece V1.2 frontend yanlışlıkla eski/uyumsuz backend'e deploy edilmez.

[context.deploy-preview.environment]
  PERSONA_CARD_BACKEND_URL = "https://persona-card-v12-staging-efaher.onrender.com"

[context.branch-deploy.environment]
  PERSONA_CARD_BACKEND_URL = "https://persona-card-v12-staging-efaher.onrender.com"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/runtime-config.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
