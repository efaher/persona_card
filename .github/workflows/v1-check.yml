name: Persona Card V1 Checks

on:
  push:
    branches: [v1-commercial-foundation]
  pull_request:
    branches: [main]

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check script syntax
        run: node --check script.js
