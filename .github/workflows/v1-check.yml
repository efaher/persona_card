name: Persona Card Frontend Checks

on:
  push:
    branches: [v1.2-annual-license-pwa]
  pull_request:
    branches: [main]

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check application JavaScript
        run: node --check script.js
      - name: Check backend router JavaScript
        run: node --check backend-router.js
      - name: Check runtime config builder
        run: node --check scripts/write-runtime-config.js
      - name: Generate staging runtime config
        env:
          PERSONA_CARD_BACKEND_URL: https://persona-card-v12-staging-efaher.onrender.com
        run: node scripts/write-runtime-config.js && node --check runtime-config.js
      - name: Check service worker JavaScript
        run: node --check service-worker.js
      - name: Validate PWA manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
